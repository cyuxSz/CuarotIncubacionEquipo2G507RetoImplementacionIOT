# Mosquitto en Windows SIN Docker (mosquitto.conf es el de Docker: sus rutas /mosquitto/... no existen aqui).
# SIN PROBAR: en esta PC no hay Mosquitto instalado.
# Uso, desde la carpeta servidor\mosquitto:
#   "C:\Program Files\mosquitto\mosquitto.exe" -v -c mosquitto.windows.conf
# Antes, crea el archivo de usuarios (una vez; pide la contrasena de cada uno):
#   "C:\Program Files\mosquitto\mosquitto_passwd.exe" -c passwd api
#   "C:\Program Files\mosquitto\mosquitto_passwd.exe" passwd dht      (y lo mismo para luz, pir, puerta, acel)
# Las rutas de abajo son relativas a la carpeta desde donde se arranca: por eso hay que estar en servidor\mosquitto.
# El cortafuegos de Windows debe permitir el puerto 1883 en redes privadas.

listener 1883
allow_anonymous false
password_file passwd
acl_file acl

# Guarda en disco los mensajes retenidos (el "estado" de cada nodo)
persistence true
persistence_location datos/
